services:
  - type: web
    name: clipai
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "10000"
      - key: WHISPER_MODEL
        value: "tiny"
      - key: WHISPER_DEVICE
        value: "cpu"
      - key: WHISPER_COMPUTE
        value: "int8"
      - key: MAX_UPLOAD_MB
        value: "0"
