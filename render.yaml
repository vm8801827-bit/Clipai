services:
  - type: web
    name: clipgenius-ai-pro
    runtime: docker
    plan: free
    region: singapore
    branch: clipgenius-ai-pro
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "10000"
      - key: WHISPER_MODEL
        value: "tiny"
      - key: WHISPER_DEVICE
        value: "cpu"
      - key: WHISPER_COMPUTE
        value: "int8"
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
